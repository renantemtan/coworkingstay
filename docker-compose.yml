services:
  db:
    image: postgres:16-alpine
    container_name: coworkingstay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coworkingstay}
      POSTGRES_USER: ${POSTGRES_USER:-coworkingstay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coworkingstay} -d ${POSTGRES_DB:-coworkingstay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coworkingstay-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://coworkingstay.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-coworkingstay}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-coworkingstay}
      SMTP_HOST: ${SMTP_HOST:-smtpout.secureserver.net}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL}
      CONTACT_RECEIVER_EMAIL: ${CONTACT_RECEIVER_EMAIL:-worknwave@coworkingstay.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LEAD_WEBHOOK_URL: ${LEAD_WEBHOOK_URL:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: coworkingstay-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
